<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Wet food / 湿粮" class="ohana-duotone-icon" style="--ohana-icon-primary: #d86a76; --ohana-icon-accent: #ffd36c;">
  <style>
  .primary { fill: var(--ohana-icon-primary, #1f8a8a); }
