name: UI Interaction Diagnostic

# Manual, non-release evidence. Focused scenarios compare real-UI journeys on a
# pinned stack and retain full result bundles. The Home Date control scenario
# opts into passive state-change logging without intercepting input delivery.
# The 132-case release manifest and its acceptance gate remain unchanged.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Focused diagnostic set to run on the disposable Tests Simulator
        required: true
        type: choice
        options: [all, remaining-switches, plant-master, failed-journeys, record-input, unresolved-controls, unresolved-controls-context, unresolved-controls-switch-input, notifications-context, ci-preflight, ci-repair-preflight, historical-failures, regression-failures, current-failures, keyboard-dismissal, water-plan-control, crew, crew-long, crew-onboarding, home-date, home-date-long, home-date-control, zen-private]
        default: all

concurrency:
  group: ui-interaction-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    name: Diagnostic ${{ matrix.scenario }} (Xcode 26.6 / iOS 26.5)
    strategy:
      fail-fast: false
      matrix:
        scenario: >-
          ${{ fromJSON(
            inputs.scenario == 'remaining-switches' && '["remaining-switches-tap","remaining-switches-swipe","remaining-switches-tap-observed","remaining-switches-swipe-observed"]' ||
            inputs.scenario == 'plant-master' && '["plant-master-control","plant-master-observed"]' ||
            inputs.scenario == 'failed-journeys' && '["failed-journeys-control","failed-journeys-observed"]' ||
            inputs.scenario == 'record-input' && '["record-input-control","record-input-observed"]' ||
            inputs.scenario == 'notifications-context' && '["unresolved-controls-context-launch-onboarding"]' ||
            inputs.scenario == 'unresolved-controls-switch-input' && '["unresolved-controls-switch-input-control","unresolved-controls-switch-input-press"]' ||
            inputs.scenario == 'unresolved-controls-context' && '["unresolved-controls-context-launch-onboarding","unresolved-controls-context-pet-care-hygiene","unresolved-controls-context-pet-long-session"]' ||
            inputs.scenario == 'unresolved-controls' && '["unresolved-controls-control","unresolved-controls-observed"]' ||
            inputs.scenario == 'crew' && '["crew"]' ||
            inputs.scenario == 'water-plan-control' && '["water-plan-control"]' ||
            inputs.scenario == 'ci-repair-preflight' && '["ci-repair-preflight"]' ||
            inputs.scenario == 'ci-preflight' && '["ci-preflight-permissions","ci-preflight-interactions"]' ||
            inputs.scenario == 'historical-failures' && '["historical-failures"]' ||
            inputs.scenario == 'regression-failures' && '["regression-failures"]' ||
            inputs.scenario == 'current-failures' && '["current-failures"]' ||
            inputs.scenario == 'keyboard-dismissal' && '["keyboard-dismissal"]' ||
            inputs.scenario == 'crew-long' && '["crew-long"]' ||
            inputs.scenario == 'crew-onboarding' && '["crew-onboarding"]' ||
            inputs.scenario == 'home-date' && '["home-date"]' ||
            inputs.scenario == 'home-date-long' && '["home-date-long"]' ||
            inputs.scenario == 'home-date-control' && '["home-date-control"]' ||
            inputs.scenario == 'zen-private' && '["zen-private"]' ||
            '["crew","home-date","home-date-control"]'
          ) }}
    runs-on: macos-26
    timeout-minutes: 120
    env:
      COPYFILE_DISABLE: 1
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6 and prepare disposable Tests Simulator
        env:
          OHANA_LOCAL_BUILD_CACHE_PARENT: ${{ runner.temp }}/OhanaLocalBuild
          OHANA_TEST_RUNTIME_VERSION: "26.5"
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          mkdir -p .build
          printf '%s\n' '00000000-0000-0000-0000-000000000001' > .build/dogfood-simulator.udid
          scripts/prepare-test-simulator.sh
          source scripts/lib/local-build-environment.sh
          test_udid="$(ohana_resolve_simulator_by_name "$OHANA_TEST_SIMULATOR_NAME_FIXED" "$OHANA_TEST_RUNTIME_VERSION")"
          ohana_assert_test_simulator_udid "$test_udid"
          printf 'OHANA_TEST_SIMULATOR_UDID=%s\n' "$test_udid" >> "$GITHUB_ENV"
      - name: Run focused governed UI diagnostics
        env:
          OHANA_LOCAL_BUILD_CACHE_PARENT: ${{ runner.temp }}/OhanaLocalBuild
          OHANA_KEEP_TEST_SIMULATOR_BOOTED: ${{ (startsWith(matrix.scenario, 'remaining-switches-') || startsWith(matrix.scenario, 'plant-master-') || startsWith(matrix.scenario, 'failed-journeys-') || startsWith(matrix.scenario, 'record-input-') || startsWith(matrix.scenario, 'unresolved-controls-') || matrix.scenario == 'home-date-control' || matrix.scenario == 'water-plan-control' || matrix.scenario == 'ci-repair-preflight') && '1' || '0' }}
        run: bash scripts/test-ui-interaction-diagnostic.sh '${{ matrix.scenario }}'
      - name: Export received-touch and control-state log
        if: always() && (startsWith(matrix.scenario, 'remaining-switches-') || startsWith(matrix.scenario, 'plant-master-') || startsWith(matrix.scenario, 'failed-journeys-') || startsWith(matrix.scenario, 'record-input-') || startsWith(matrix.scenario, 'unresolved-controls-') || startsWith(matrix.scenario, 'ci-preflight-') || matrix.scenario == 'ci-repair-preflight' || matrix.scenario == 'water-plan-control' || matrix.scenario == 'crew' || matrix.scenario == 'historical-failures' || matrix.scenario == 'regression-failures' || matrix.scenario == 'current-failures' || matrix.scenario == 'keyboard-dismissal' || matrix.scenario == 'crew-long' || matrix.scenario == 'crew-onboarding' || matrix.scenario == 'home-date-control')
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          DIAGNOSTIC_SCENARIO: ${{ matrix.scenario }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          devices = json.loads(subprocess.check_output(
              ['xcrun', 'simctl', 'list', 'devices', 'available', '--json'], text=True
          ))
          matches = [
              device for runtime_devices in devices['devices'].values()
              for device in runtime_devices
              if device.get('name') == 'iPhone 17 Tests'
              and device.get('udid') == os.environ.get('OHANA_TEST_SIMULATOR_UDID')
          ]
          scenario = os.environ['DIAGNOSTIC_SCENARIO']
          target = Path(os.environ['RUNNER_TEMP']) / f'ui-interaction-{scenario}-app.log'
          if len(matches) != 1:
              target.write_text(f'Could not identify one Tests Simulator: {len(matches)} matches.\n')
              raise SystemExit(0)
          simulator = matches[0]
          simulator_id = simulator['udid']
          state = simulator.get('state')
          if state == 'Shutdown':
              subprocess.run(['xcrun', 'simctl', 'boot', simulator_id], check=True)
          elif state != 'Booted':
              target.write_text(f'Tests Simulator is not ready for log export: {state}\n')
              raise SystemExit(0)
          subprocess.run(['xcrun', 'simctl', 'bootstatus', simulator_id, '-b'], check=True)
          predicate = 'subsystem == "com.guanchen.li.Ohana" AND category == "UITestTouchTrace"'
          with target.open('w') as output:
              completed = subprocess.run([
                  'xcrun', 'simctl', 'spawn', simulator_id, 'log', 'show',
                  '--last', '3h', '--style', 'compact', '--predicate', predicate,
              ], stdout=output, stderr=subprocess.STDOUT)
          print(f'Exported simulator app log: {target}; exit={completed.returncode}')
          shutdown = subprocess.run(['xcrun', 'simctl', 'shutdown', simulator_id])
          if shutdown.returncode:
              print(f'Could not shut down Tests Simulator (exit {shutdown.returncode}).')
          PY
      - name: Record diagnostic receipt
        if: always()
        env:
          DIAGNOSTIC_SCENARIO: ${{ matrix.scenario }}
        run: |
          python3 - <<'PY'
          import glob
          import json
          import os
          import subprocess
          from pathlib import Path

          scenario = os.environ['DIAGNOSTIC_SCENARIO']
          result_root = Path(os.environ['RUNNER_TEMP']) / 'OhanaLocalBuild'
          bundles = sorted(glob.glob(str(result_root / '*' / 'TestResults' / 'failed' / '*.xcresult')))
          bundles += sorted(glob.glob(str(result_root / '*' / 'TestResults' / 'success' / '*.xcresult')))
          receipt = {
              'kind': 'focused-ui-diagnostic-not-release-acceptance',
              'scenario': scenario,
              'revision': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'bundles': [],
          }
          for bundle in bundles:
              try:
                  raw = subprocess.check_output([
                      'xcrun', 'xcresulttool', 'get', 'test-results', 'summary',
                      '--path', bundle, '--compact',
                  ])
                  summary = json.loads(raw)
              except (subprocess.CalledProcessError, json.JSONDecodeError) as error:
                  summary = {'extractionError': str(error)}
              receipt['bundles'].append({'path': bundle, 'summary': summary})
          target = Path(os.environ['RUNNER_TEMP']) / f'ui-interaction-{scenario}-diagnostic.json'
          target.write_text(json.dumps(receipt, indent=2) + '\n')
          print(target)
          PY
      - name: Upload diagnostic receipt and full xcresult attachments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-interaction-${{ matrix.scenario }}-diagnostic
          path: |
            ${{ runner.temp }}/ui-interaction-${{ matrix.scenario }}-diagnostic.json
            ${{ runner.temp }}/OhanaLocalBuild/*/TestResults/failed/*.xcresult
            ${{ runner.temp }}/OhanaLocalBuild/*/TestResults/success/*.xcresult
            ${{ runner.temp }}/ui-interaction-*-app.log
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
