name: CI

# Mature-app gate: every push/PR must pass build + tests + repo audits + lint
# before merge. Zero-baseline correctness rules remain whole-repo gates;
# heuristic signals with accepted history use warning bands or merge-base
# deltas so an unrelated PR cannot inherit old debt.
#
# Gate model:
#   - Audit self-tests run FIRST: fixtures prove every audit rule still fires,
#     and a scanned-file floor proves no directory refactor silently shrank an
#     audit's scope (this happened once: 88% of files dropped out of three
#     "whole repo" gates after the Features/ refactor).
#   - UI V4 / accessibility / smoothness run as direct full-scope strict
#     zero-warning gates. The historical zero baseline remains in
#     docs/governance/manifests/full-scope-audit-baseline.json as promotion
#     evidence, not as a debt allowance.
#   - Tool versions are pinned via scripts/ci-tool-versions.env so brew updates
#     cannot silently change lint/audit behavior. A pin mismatch is a deliberate
#     one-line bump, not an emergency.
#   - Swift file length and raw source-resource bytes are review proxies. Their
#     hard limits still block, but warning-band or unchanged historical state
#     does not. SwiftFormat is scoped to the commit range on push/PR.
#
# Branch protection (configure in GitHub repo settings, not in this file):
#   - Require status checks: build-test, audits, lint
#   - Require branches up to date before merging

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}

jobs:
  # ----------------------------------------------------------------------------
  # Repo audits: pure ripgrep/bash/Python, fast, no Xcode needed. These are the
  # cheap gates that catch most rule violations (UI tokens, runtime guardrails,
  # localization coverage, accessibility heuristics, release data safety,
  # governance manifests, secret scanning, and resource/signing detritus).
  # ----------------------------------------------------------------------------
  audits:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install tools
        run: brew install ripgrep gitleaks
      - name: Tool version pins
        run: scripts/check-tool-versions.sh rg gitleaks
      # Self-tests first: if the audits themselves are broken (dead regex,
      # collapsed scan scope), every later "passed" line is meaningless.
      - name: Audit self-tests (fixtures + scope floor)
        run: scripts/tests/run-audit-fixture-tests.sh
      - name: CI severity / diff policy self-tests
        run: scripts/tests/run-ci-policy-tests.sh
      - name: UI test shard completeness
        run: scripts/audit-ui-test-shards.sh
      # Full-scope strict gates for UI V4 + accessibility + smoothness +
      # route first-frame safety. The
      # ratchet baseline is now zero; keep these direct `--all` scans required.
      - name: UI V4 audit (whole repo, strict)
        run: scripts/audit-ui-v4.sh --all
      - name: Accessibility audit (whole repo, strict)
        run: scripts/audit-accessibility.sh --all
      - name: Smoothness audit (whole repo, strict)
        run: scripts/audit-smoothness-risk.sh --all
      - name: Route first-frame audit (whole repo, strict)
        run: scripts/audit-route-first-frame.sh --all
      # Whole-repo hard gates for mature-app invariants (baseline already zero).
      - name: Runtime guardrails audit (whole repo, strict)
        run: scripts/audit-runtime-guardrails.sh --all
      - name: Architecture boundaries audit (whole repo, strict)
        run: scripts/audit-architecture-boundaries.sh --all
      - name: Economy boundaries audit (whole repo, ratcheted)
        run: scripts/audit-economy-boundaries.sh --all
      - name: Member lifecycle gate audit (whole repo, strict)
        run: scripts/audit-member-lifecycle-gate.sh --all
      - name: Derived-state lifecycle audit (whole repo, ratcheted)
        run: scripts/audit-derived-state-lifecycle.sh --all
      - name: Shared-care note metadata audit (whole repo, strict)
        run: scripts/audit-shared-care-note-metadata.sh --all
      - name: Localization coverage audit
        run: scripts/audit-localization-coverage.sh
      - name: Release data-safety audit
        run: scripts/audit-release-data-safety.sh
      - name: Governance manifests audit
        run: scripts/audit-governance-manifests.sh
      - name: Agent skill governance audit
        run: scripts/audit-agent-skill-governance.sh
      - name: Resource integrity / xattr pre-sign audit
        run: |
          if [[ -n "$CI_DIFF_BASE_SHA" ]]; then
            scripts/audit-resource-integrity.sh --base-ref "$CI_DIFF_BASE_SHA"
          else
            scripts/audit-resource-integrity.sh
          fi
      - name: Git size audit
        run: scripts/audit-git-size.sh
      - name: Secret scan (working tree)
        run: gitleaks detect --no-git --redact --no-banner --source . --config .gitleaks.toml

  # ----------------------------------------------------------------------------
  # Lint / format: SwiftLint + SwiftFormat (lint mode, no writes), versions
  # pinned via scripts/ci-tool-versions.env.
  # ----------------------------------------------------------------------------
  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install tools
        run: |
          brew update
          brew install swiftlint swiftformat
          brew upgrade swiftlint swiftformat
      - name: Tool version pins
        run: scripts/check-tool-versions.sh swiftlint swiftformat
      - name: Complexity audit self-tests
        run: scripts/tests/run-code-complexity-fixture-tests.sh
      - name: Production complexity ratchet
        run: scripts/audit-code-complexity.sh --all
      # SwiftLint runs as a strict gate after the P1 warning baseline cleanup.
      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging
      # Formatting has historical drift, so push/PR checks own only their diff.
      # Explicit workflow-dispatch/release debt scans can still use --all.
      - name: SwiftFormat (commit range, lint only)
        run: |
          if [[ -n "$CI_DIFF_BASE_SHA" ]]; then
            scripts/ci-swiftformat.sh --base-ref "$CI_DIFF_BASE_SHA"
          else
            scripts/ci-swiftformat.sh --all
          fi

  # ----------------------------------------------------------------------------
  # Build + test on the pinned-by-name simulator.
  #
  # NOTE: Ohana targets iOS 26.x, so this job REQUIRES a runner image whose
  # Xcode ships the iOS 26 SDK + an "iPhone 17" simulator. GitHub-hosted images
  # may lag the latest SDK; if the preflight below fails persistently, move to
  # a newer macos image or a self-hosted runner — do NOT mark this job optional
  # and learn to ignore it. A required check that cannot go green is a gate in
  # name only. See docs/os-support-matrix.md.
  #
  # Speed notes (this job is the wall-clock long pole):
  #   - Only the unit test bundle runs here through the OhanaUnitTests scheme.
  #     The main Ohana scheme still references the UI test runner through its
  #     test plan, so using a unit-only scheme avoids paying the real UI-suite
  #     cold-runner cost on every push. The local module-exit-gate and launch
  #     acceptance work run selected UI flows; add a scheduled UI job before
  #     treating UI coverage as a per-push CI gate.
  #   - Build intermediates are cached across runs (no SPM deps, so the cache
  #     target is just DerivedData/Build). Exact-key miss on every source change
  #     is expected; restore-keys give the latest partial cache for incremental.
  #   - xcbeautify (a brew install ~1min) is dropped in favor of `-quiet`;
  #     errors still print, and the raw xcresult is uploaded as an artifact.
  #   - The complete unit target runs once from those built products. Temporary
  #     crash isolation is a diagnostic tool, not a permanent source of extra
  #     simulator launches after the underlying defect is fixed.
  # ----------------------------------------------------------------------------
  build-test:
    runs-on: macos-15
    env:
      COPYFILE_DISABLE: 1
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Cache build intermediates
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/DerivedData/Build
          key: deriveddata-${{ runner.os }}-${{ hashFiles('**/*.swift', 'Ohana.xcodeproj/project.pbxproj') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-
      - name: Show toolchain
        run: |
          xcodebuild -version
          scripts/diagnose-simulator.sh --brief || {
            echo "::error::No healthy 'iPhone 17' simulator available on this runner. See docs/os-support-matrix.md."
            exit 1
          }
      - name: Build and run complete unit suite once
        run: scripts/ci-run-unit-tests.sh
      - name: Print test failure summary
        if: failure()
        run: |
          {
            printf '%s\n' 'import json'
            printf '%s\n' 'import sys'
            printf '%s\n' 'passed_results = {"Passed", "Skipped", "Expected Failure"}'
            printf '%s\n' 'def walk(node, parents):'
            printf '%s\n' '    name = node.get("name") or node.get("nodeIdentifier") or "<unnamed>"'
            printf '%s\n' '    path = parents + [name]'
            printf '%s\n' '    if node.get("nodeType") == "Failure Message":'
            printf '%s\n' '        print(f"  issue: {name}")'
            printf '%s\n' '    result = node.get("result")'
            printf '%s\n' '    if result and result not in passed_results:'
            printf '%s\n' '        identifier = node.get("nodeIdentifier", "")'
            printf '%s\n' '        print(f"{result}: " + " / ".join(path))'
            printf '%s\n' '        if identifier and identifier != name:'
            printf '%s\n' '            print(f"  id: {identifier}")'
            printf '%s\n' '        for issue in node.get("issues", []) or []:'
            printf '%s\n' '            message = issue.get("message") or issue.get("summary") or issue.get("description")'
            printf '%s\n' '            if message:'
            printf '%s\n' '                print(f"  issue: {message}")'
            printf '%s\n' '    for child in node.get("children", []) or []:'
            printf '%s\n' '        walk(child, path)'
            printf '%s\n' 'try:'
            printf '%s\n' '    with open(sys.argv[1], encoding="utf-8") as handle:'
            printf '%s\n' '        payload = json.load(handle)'
            printf '%s\n' 'except Exception as exc:'
            printf '%s\n' '    print(f"Could not parse xcresult tests JSON: {exc}")'
            printf '%s\n' '    sys.exit(0)'
            printf '%s\n' 'if isinstance(payload, dict) and isinstance(payload.get("testNodes"), list):'
            printf '%s\n' '    roots = payload["testNodes"]'
            printf '%s\n' 'else:'
            printf '%s\n' '    roots = payload if isinstance(payload, list) else [payload]'
            printf '%s\n' 'for root in roots:'
            printf '%s\n' '    walk(root, [])'
          } > "$RUNNER_TEMP/print_xcresult_failures.py"

          shopt -s nullglob
          bundles=("$RUNNER_TEMP"/TestResults-*.xcresult)
          if [[ ${#bundles[@]} -eq 0 ]]; then
            echo "::warning::No TestResults xcresult bundles were produced."
            exit 0
          fi
          for bundle in "${bundles[@]}"; do
            bundle_name="$(basename "$bundle")"
            tests_json="${bundle%.xcresult}.tests.json"
            echo "::group::${bundle_name} summary"
            xcrun xcresulttool get test-results summary --path "$bundle" --compact || true
            xcrun xcresulttool get test-results tests --path "$bundle" --compact > "$tests_json" || true
            python3 "$RUNNER_TEMP/print_xcresult_failures.py" "$tests_json"
            echo "::endgroup::"
          done
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/TestResults-*.xcresult
          retention-days: 7
