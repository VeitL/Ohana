name: CI

# Mature-app gate: every push/PR must pass build + tests + repo audits + lint
# before merge. This turns the prose rules in AGENTS.md and docs/ into
# mechanically-enforced gates instead of "please remember to run the script".
#
# Branch protection (configure in GitHub repo settings, not in this file):
#   - Require status checks: build-test, audits, lint
#   - Require branches up to date before merging

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Repo audits: pure ripgrep/bash/Python, fast, no Xcode needed. These are the
  # cheap gates that catch most rule violations (UI tokens, runtime guardrails,
  # localization coverage, accessibility heuristics, release data safety,
  # governance manifests, and resource/signing detritus).
  # ----------------------------------------------------------------------------
  audits:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install ripgrep
        run: brew install ripgrep
      # Changed-file audits gate NEW code strictly. The full-scope ratchet below
      # runs the same audit families across the whole repo and blocks any
      # file/rule debt increase until the baseline reaches zero.
      - name: Compute changed Swift files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            RANGE="$BASE...HEAD"
          else
            RANGE="${{ github.event.before }}...HEAD"
          fi
          FILES=$(git diff --name-only --diff-filter=ACMR "$RANGE" -- 'Ohana/Views/**/*.swift' 'Ohana/Utilities/**/*.swift' 2>/dev/null | tr '\n' ' ' || true)
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Changed view/util Swift files: ${FILES:-<none>}"
      - name: UI V4 audit (changed files, strict)
        if: steps.changed.outputs.files != ''
        run: scripts/audit-ui-v4.sh ${{ steps.changed.outputs.files }}
      - name: Accessibility audit (changed files, strict)
        if: steps.changed.outputs.files != ''
        run: scripts/audit-accessibility.sh ${{ steps.changed.outputs.files }}
      - name: Smoothness risk audit (changed files, strict)
        if: steps.changed.outputs.files != ''
        run: scripts/audit-smoothness-risk.sh ${{ steps.changed.outputs.files }}
      - name: UI/accessibility/smoothness audit (whole repo ratchet)
        run: scripts/audit-full-scope-ratchet.sh
      # Whole-repo hard gates for mature-app invariants.
      - name: Runtime guardrails audit (whole repo, strict)
        run: scripts/audit-runtime-guardrails.sh --all
      - name: Localization coverage audit
        run: scripts/audit-localization-coverage.sh
      - name: Release data-safety audit
        run: scripts/audit-release-data-safety.sh
      - name: Governance manifests audit
        run: scripts/audit-governance-manifests.sh
      - name: Resource integrity / xattr pre-sign audit
        run: scripts/audit-resource-integrity.sh
      - name: Git size audit
        run: scripts/audit-git-size.sh

  # ----------------------------------------------------------------------------
  # Lint / format: SwiftLint + SwiftFormat (lint mode, no writes).
  # ----------------------------------------------------------------------------
  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install swiftlint swiftformat
      # SwiftLint runs as a real gate: .swiftlint.yml is tuned lenient, so this
      # fails only on error-severity rules (no --strict yet — flip to --strict
      # once the warning baseline is cleaned).
      - name: SwiftLint
        run: swiftlint lint --reporter github-actions-logging
      # SwiftFormat starts report-only. After one baseline pass (`swiftformat .`
      # then commit), remove continue-on-error to enforce.
      - name: SwiftFormat (lint only)
        continue-on-error: true
        run: swiftformat --lint .

  # ----------------------------------------------------------------------------
  # Build + test on the fixed simulator.
  #
  # NOTE: Ohana targets iOS 26.2, so this job REQUIRES a runner image whose
  # Xcode ships the iOS 26 SDK + an "iPhone 17" simulator. GitHub-hosted images
  # may lag the latest SDK; if so, use a self-hosted runner or the appropriate
  # macos-26 image. See docs/os-support-matrix.md.
  # ----------------------------------------------------------------------------
  build-test:
    runs-on: macos-15
    env:
      COPYFILE_DISABLE: 1
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Install xcbeautify
        run: brew install xcbeautify
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -E 'iPhone 17' || {
            echo "::error::No 'iPhone 17' simulator available on this runner. See docs/os-support-matrix.md."
            exit 1
          }
      - name: Build & test
        run: |
          xcodebuild test \
            -project Ohana.xcodeproj \
            -scheme Ohana \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            CODE_SIGNING_ALLOWED=NO | xcbeautify || exit 1
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/TestResults.xcresult
          retention-days: 7
