# SwiftLint configuration for Ohana.
#
# Philosophy (mature-app ratchet): keep the active gate focused on rules that
# are safe to enforce across the existing mature codebase. CI runs
# `swiftlint lint --strict`, so every enabled warning is a blocking failure.
# Broad style/shape rules that require feature refactors stay disabled until a
# dedicated ratchet phase makes them mechanically safe.

included:
  - Ohana
  - OhanaTests
  - OhanaUITests

excluded:
  - .build
  - Ohana/Assets.xcassets
  - Ohana/PetAvatarAssets
  - "**/*.generated.swift"
  - Ai_Studio_New_UI
  - ohana-design-system

# Rules that are too noisy for this codebase's current style; revisit later.
disabled_rules:
  - todo                       # progress notes/TODOs are used intentionally
  - line_length                # long localized strings + SwiftUI chains
  - function_body_length       # large SwiftUI view bodies (tracked via file-split rule)
  - type_body_length
  - file_length                # AGENTS.md "avoid oversized files" handles this qualitatively
  - cyclomatic_complexity
  - nesting
  - identifier_name            # short SwiftUI idioms (e.g. l, p, h, d) are common here
  - large_tuple
  - for_where
  - empty_count                # legacy style debt; re-enable with a targeted autofix pass
  - empty_string               # legacy style debt; re-enable with a targeted autofix pass
  - first_where                # legacy style debt; re-enable with a targeted autofix pass
  - function_parameter_count   # existing service/view APIs exceed 8 params; refactor by feature
  - implicit_optional_initialization
  - inclusive_language         # product/domain vocabulary needs a reviewed rename plan
  - multiple_closures_with_trailing_closure
  - statement_position
  - static_over_final_class
  - type_name                  # several existing descriptive SwiftUI types exceed 40 chars
  - unneeded_synthesized_initializer
  - void_function_in_ternary

# High-value rules turned ON beyond defaults.
opt_in_rules:
  - last_where
  - contains_over_first_not_nil
  - toggle_bool
  - explicit_init
  - redundant_nil_coalescing
  - weak_delegate
  - prefer_self_type_over_type_of_self
  - closure_spacing
  - operator_usage_whitespace

analyzer_rules:
  - unused_import
  - unused_declaration

# Generous thresholds so legacy code is not error-flooded.
force_cast: warning
force_try: warning

trailing_whitespace:
  ignores_empty_lines: true

# A few error-severity gates (these are correctness/safety, kept small):
custom_rules:
  no_ark_app_group:
    name: "Legacy Ark app group"
    regex: "group\\.com\\.[A-Za-z.]*Ark"
    match_kinds: [string]   # code literals only; comments may mention history
    message: "Use group.com.guanchen.li.Ohana, not legacy Ark app-group identifiers (AGENTS.md)."
    severity: error
  no_print_in_app:
    name: "print() in app code"
    regex: "(^|\\s)print\\("
    match_kinds: [identifier]
    message: "Use OSLog / Logger instead of print() in shipping code (docs/concurrency-and-error-policy.md)."
    severity: warning
  no_language_ternary:
    name: "Direct language ternary"
    regex: "appLanguage\\s*==\\s*\"zh\""
    message: "Use L10n(appLanguage).tr(zh:en:...) instead of language ternaries (AGENTS.md Localization)."
    severity: warning
  main_actor_read_model_refresh:
    name: "Main-actor read-model aggregation"
    regex: "Task\\s*\\{\\s*@MainActor"
    included: ".*(ReadModel|SnapshotStore|SnapshotBuilder)[^/]*\\.swift"
    message: "Read-model/snapshot refresh must aggregate off the main actor (@ModelActor or background context) and deliver Equatable snapshots to the MainActor (AGENTS.md Off-Main Aggregation Law)."
    severity: warning
